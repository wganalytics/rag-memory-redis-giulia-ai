<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 680 880"
  width="2040" height="2640"
  role="img"
  style="font-family: 'Inter', 'Segoe UI', sans-serif; background: #0f1117;">

  <title>PRJ-02 RAG com Memória (Redis) — GIULIA AI Engineering Ecosystem</title>
  <desc>Pipeline RAG com persistência de histórico de chat via Redis: PDF → ChromaDB → Redis Memory → RagEngine → Ollama</desc>

  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="var(--arr-color, #4a5568)"/>
    </marker>

    <!-- Glow filter for central node -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    :root {
      --bg: #0f1117;
      --surface: #161b27;
      --border-primary: rgba(255,255,255,0.15);
      --border-secondary: rgba(255,255,255,0.08);
      --border-tertiary: rgba(255,255,255,0.05);
      --text-primary: #e8eaf0;
      --text-secondary: #8892a4;
    }

    .th {
      fill: #e8eaf0;
      font-size: 12px;
      font-weight: 600;
    }
    .ts {
      fill: #8892a4;
      font-size: 10px;
      font-weight: 400;
    }
    .arr {
      stroke-width: 1.2;
      fill: none;
    }

    /* Node colors */
    .c-gray  rect { fill: #1e2330; stroke: rgba(148,163,184,0.4); }
    .c-teal  rect { fill: #0d2d2d; stroke: rgba( 45,212,191,0.45); }
    .c-purple rect { fill: #1e1530; stroke: rgba(139,92, 246,0.5); }
    .c-blue  rect { fill: #0d1e3d; stroke: rgba( 59,130,246,0.6); }
    .c-amber rect { fill: #2d1f00; stroke: rgba(245,158, 11,0.5); }
    .c-coral rect { fill: #2d1010; stroke: rgba(239, 68, 68,0.5); }
    .c-green rect { fill: #0d2d1a; stroke: rgba( 34,197, 94,0.5); }

    .c-gray  .th { fill: #94a3b8; }
    .c-teal  .th { fill: #2dd4bf; }
    .c-purple .th { fill: #a78bfa; }
    .c-blue  .th { fill: #60a5fa; }
    .c-amber .th { fill: #fbbf24; }
    .c-coral .th { fill: #f87171; }
    .c-green .th { fill: #4ade80; }

    .node { transition: opacity 0.2s; }
    .node rect { stroke-width: 0.5; }

    /* Arrow colors per flow */
    .arr-gray   { stroke: rgba(148,163,184,0.4); }
    .arr-teal   { stroke: rgba( 45,212,191,0.4); }
    .arr-purple { stroke: rgba(139, 92,246,0.4); }
    .arr-blue   { stroke: rgba( 59,130,246,0.5); }
    .arr-green  { stroke: rgba( 34,197, 94,0.4); }

    /* Phase labels */
    .phase-label {
      fill: rgba(255,255,255,0.3);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
  </style>

  <!-- Background -->
  <rect width="680" height="880" fill="#0f1117"/>

  <!-- Header -->
  <rect x="0" y="0" width="680" height="56" fill="#0d1117"/>
  <text x="340" y="24" text-anchor="middle" dominant-baseline="central"
    font-size="13" font-weight="700" fill="#e8eaf0">
    PRJ-02 · RAG com Memória Contextual (Redis)
  </text>
  <text x="340" y="44" text-anchor="middle" dominant-baseline="central"
    font-size="10" fill="#4ade80" letter-spacing="2">
    REDIS PERSISTENCE · 100% LOCAL · GIULIA AI ECOSYSTEM
  </text>

  <!-- FASE 1: INGESTÃO -->
  <text class="phase-label" x="40" y="88">INGESTÃO &amp; INDEXAÇÃO</text>
  <line x1="40" y1="96" x2="640" y2="96" stroke="rgba(255,255,255,0.05)" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- Node: PDF Documents -->
  <g class="node c-amber">
    <rect x="40" y="110" width="160" height="52" rx="8"/>
    <text class="th" x="120" y="130" text-anchor="middle" dominant-baseline="central">📄 PDF Ingestion</text>
    <text class="ts" x="120" y="149" text-anchor="middle" dominant-baseline="central">PyMuPDFLoader</text>
  </g>

  <!-- Arrow: Ingest → Splitter -->
  <line x1="200" y1="136" x2="238" y2="136" class="arr arr-gray" marker-end="url(#arrow)"/>

  <!-- Node: RecursiveTextSplitter -->
  <g class="node c-teal">
    <rect x="240" y="110" width="180" height="52" rx="8"/>
    <text class="th" x="330" y="130" text-anchor="middle" dominant-baseline="central">RecursiveTextSplitter</text>
    <text class="ts" x="330" y="149" text-anchor="middle" dominant-baseline="central">Size 1000 · Overlap 100</text>
  </g>

  <!-- Arrow: Splitter → ChromaDB -->
  <line x1="420" y1="136" x2="458" y2="136" class="arr arr-teal" marker-end="url(#arrow)"/>

  <!-- Node: ChromaDB (Vector Store) -->
  <g class="node class c-purple">
    <rect x="460" y="110" width="180" height="52" rx="8"/>
    <text class="th" x="550" y="130" text-anchor="middle" dominant-baseline="central">🗄️ ChromaDB</text>
    <text class="ts" x="550" y="149" text-anchor="middle" dominant-baseline="central">Vector DB · k=5, MMR</text>
  </g>

  <!-- FASE 2: PERSISTÊNCIA -->
  <line x1="40" y1="228" x2="640" y2="228" stroke="rgba(255,255,255,0.05)" stroke-width="0.5" stroke-dasharray="4 4"/>
  <text class="phase-label" x="40" y="220">PERSISTÊNCIA DE CONVERSA (REDIS)</text>

  <!-- Node: User Interaction -->
  <g class="node c-amber">
    <rect x="40" y="248" width="160" height="52" rx="8"/>
    <text class="th" x="120" y="268" text-anchor="middle" dominant-baseline="central">🙋 User + Session ID</text>
    <text class="ts" x="120" y="287" text-anchor="middle" dominant-baseline="central">FastAPI /chat Endpoint</text>
  </g>

  <!-- Arrow: User → Redis Factory -->
  <line x1="200" y1="274" x2="238" y2="274" class="arr arr-gray" marker-end="url(#arrow)"/>

  <!-- Node: RedisChatMessageHistory -->
  <g class="node c-purple">
    <rect x="240" y="248" width="220" height="52" rx="8"/>
    <text class="th" x="350" y="268" text-anchor="middle" dominant-baseline="central">RedisChatMessageHistory</text>
    <text class="ts" x="350" y="287" text-anchor="middle" dominant-baseline="central">Fábrica de Histórico por UUID</text>
  </g>

  <!-- Arrow: Redis History ↔ Redis Cache Server -->
  <line x1="350" y1="300" x2="350" y2="338" class="arr arr-purple" marker-end="url(#arrow)"/>

  <!-- Node: Redis Server -->
  <g class="node c-purple">
    <rect x="240" y="340" width="220" height="52" rx="8"/>
    <text class="th" x="350" y="360" text-anchor="middle" dominant-baseline="central">🔴 Redis Cache Server</text>
    <text class="ts" x="350" y="379" text-anchor="middle" dominant-baseline="central">Persistência isolada por sessão</text>
  </g>

  <!-- FASE 3: ORQUESTRAÇÃO -->
  <line x1="40" y1="440" x2="640" y2="440" stroke="rgba(255,255,255,0.05)" stroke-width="0.5" stroke-dasharray="4 4"/>
  <text class="phase-label" x="40" y="432">ORQUESTRAÇÃO &amp; INFERÊNCIA LCEL</text>

  <!-- Node: RagEngine Singleton -->
  <g class="node c-blue" filter="url(#glow)">
    <rect x="210" y="460" width="260" height="72" rx="10" stroke-width="1.5"/>
    <text class="th" x="340" y="482" text-anchor="middle" dominant-baseline="central" font-size="13">⚙️ RagEngine (Singleton)</text>
    <text class="ts" x="340" y="502" text-anchor="middle" dominant-baseline="central">RunnableWithMessageHistory</text>
    <text class="ts" x="340" y="519" text-anchor="middle" dominant-baseline="central">Auto-injeção de Histórico e Contexto</text>
  </g>

  <!-- Arrow: ChromaDB → RagEngine -->
  <path d="M 550 162 L 550 496 L 472 496" class="arr arr-purple" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text class="ts" x="555" y="200" text-anchor="start" opacity="0.6">MMR Retrieval (k=5)</text>

  <!-- Arrow: Redis History → RagEngine -->
  <line x1="350" y1="248" x2="350" y2="210" class="arr arr-purple" stroke-dasharray="3 3"/>
  <path d="M 350 210 L 10 210 L 10 496 L 210 496" class="arr arr-purple" marker-end="url(#arrow)"/>
  <text class="ts" x="15" y="200" text-anchor="start" opacity="0.6">History Retrieval</text>

  <!-- Node: ChatOllama -->
  <g class="node c-coral">
    <rect x="500" y="460" width="140" height="72" rx="8"/>
    <text class="th" x="570" y="482" text-anchor="middle" dominant-baseline="central">🦙 ChatOllama</text>
    <text class="ts" x="570" y="502" text-anchor="middle" dominant-baseline="central">Llama3 / Local</text>
    <text class="ts" x="570" y="519" text-anchor="middle" dominant-baseline="central">Temperature: 0.1</text>
  </g>

  <!-- Arrow: RagEngine → ChatOllama -->
  <line x1="470" y1="496" x2="498" y2="496" class="arr arr-coral" marker-end="url(#arrow)"/>

  <!-- FASE 4: GERAÇÃO -->
  <line x1="40" y1="578" x2="640" y2="578" stroke="rgba(255,255,255,0.05)" stroke-width="0.5" stroke-dasharray="4 4"/>
  <text class="phase-label" x="40" y="570">GERAÇÃO &amp; RESPOSTA</text>

  <!-- Arrow: ChatOllama down -->
  <path d="M 570 532 L 570 600 L 460 600" class="arr arr-green" marker-end="url(#arrow)"/>

  <!-- Node: StrOutputParser -->
  <g class="node c-teal">
    <rect x="220" y="574" width="240" height="52" rx="8"/>
    <text class="th" x="340" y="594" text-anchor="middle" dominant-baseline="central">StrOutputParser</text>
    <text class="ts" x="340" y="613" text-anchor="middle" dominant-baseline="central">Formatador de Saída String</text>
  </g>

  <!-- Arrow: Parser → final response -->
  <line x1="340" y1="626" x2="340" y2="664" class="arr arr-green" marker-end="url(#arrow)"/>

  <!-- Node: Contextual Response -->
  <g class="node c-green">
    <rect x="130" y="676" width="420" height="52" rx="8"/>
    <text class="th" x="340" y="696" text-anchor="middle" dominant-baseline="central">✅ Resposta Conversacional Embasada</text>
    <text class="ts" x="340" y="715" text-anchor="middle" dominant-baseline="central">Persiste resposta no Redis + retorna fontes únicas do Vector DB</text>
  </g>

  <!-- INTERFACES -->
  <!-- Node: FastAPI -->
  <g class="node c-gray">
    <rect x="40" y="574" width="160" height="52" rx="8"/>
    <text class="th" x="120" y="594" text-anchor="middle" dominant-baseline="central">⚡ FastAPI Backend</text>
    <text class="ts" x="120" y="613" text-anchor="middle" dominant-baseline="central">/chat · /upload_pdf · /health</text>
  </g>

  <!-- Node: Streamlit UI -->
  <g class="node c-gray">
    <rect x="40" y="640" width="160" height="52" rx="8"/>
    <text class="th" x="120" y="660" text-anchor="middle" dominant-baseline="central">Streamlit UI</text>
    <text class="ts" x="120" y="679" text-anchor="middle" dominant-baseline="central">Chat de Sessões isoladas</text>
  </g>

  <!-- Arrows: FastAPI <-> UI -->
  <line x1="120" y1="640" x2="120" y2="626" class="arr arr-gray" marker-end="url(#arrow)"/>
  <line x1="200" y1="600" x2="218" y2="600" class="arr arr-gray" marker-end="url(#arrow)"/>

  <!-- FOOTER -->
  <rect x="40" y="776" width="600" height="36" rx="6"
    fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <text class="ts" x="340" y="794" text-anchor="middle" dominant-baseline="central" opacity="0.7">
    Métricas Reais: 10 arquivos Python · 887 linhas · 7 testes pytest OK (0.07s) · Epic GARE-39 Done
  </text>

  <!-- Bottom gap -->
  <rect x="0" y="830" width="680" height="50" fill="#0d1117"/>
  <text x="340" y="855" text-anchor="middle" dominant-baseline="central"
    font-size="9" fill="rgba(255,255,255,0.2)" letter-spacing="1">
    github.com/wganalytics · RAG + Redis Chat Persistence · Local-first
  </text>
</svg>
